<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LostLink - Matches</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #1d3557;
        }

        h2 {
            margin-top: 0;
            color: #1d3557;
        }

        .card {
            background: white;
            padding: 22px;
            margin-bottom: 25px;
            border-radius: 14px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .lost-card {
            border-left: 6px solid #e63946;
        }

        .match-card {
            border-left: 6px solid #2a9d8f;
            margin-top: 18px;
        }

        .field {
            margin: 9px 0;
            line-height: 1.5;
        }

        .label {
            font-weight: bold;
            color: #444;
        }

        .score-box {
            background: #eef7f5;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
        }

        .score {
            font-size: 27px;
            font-weight: bold;
            color: #16866f;
        }

        .score-title {
            font-size: 14px;
            color: #555;
            margin-bottom: 5px;
        }

        .details {
            background: #f7f8fa;
            padding: 13px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 7px 0;
            border-bottom: 1px solid #e5e5e5;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .photo {
            display: block;
            width: 100%;
            max-width: 300px;
            max-height: 250px;
            object-fit: contain;
            margin: 15px auto 5px;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        .match-number {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #333;
        }

        .loading {
            text-align: center;
            padding: 25px;
            font-size: 17px;
            color: #666;
        }

        .error {
            background: #ffecec;
            color: #c62828;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .no-match {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        @media (max-width: 600px) {

            body {
                padding: 12px;
            }

            .card {
                padding: 16px;
            }

            .detail-row {
                flex-direction: column;
                gap: 3px;
            }

            .score {
                font-size: 24px;
            }
        }
    </style>
</head>


<body>

<div class="container">

    <h1>🔎 LostLink</h1>


    <!-- LOST ITEM -->

    <div class="card lost-card">

        <h2>🔴 Lost Item</h2>

        <div id="lostItem">
            <div class="loading">
                Loading...
            </div>
        </div>

    </div>


    <!-- FOUND MATCHES -->

    <div class="card">

        <h2>🟢 Possible Found Matches</h2>

        <div id="matches">

            <div class="loading">
                Loading matches...
            </div>

        </div>

    </div>

</div>


<script>

async function loadMatches() {

    const lostItem =
        document.getElementById("lostItem");

    const matches =
        document.getElementById("matches");


    try {

        /*
         * Get all reports from the backend
         */

        const response =
            await fetch("/reports");


        if (!response.ok) {
            throw new Error(
                "Unable to load reports"
            );
        }


        const reports =
            await response.json();


        /*
         * Find LOST report
         */

        const lostReports =
            reports.filter(
                report =>
                    report.report_type === "LOST"
            );


        if (lostReports.length === 0) {

            lostItem.innerHTML =
                "<div class='no-match'>No LOST report found.</div>";

            matches.innerHTML =
                "<div class='no-match'>No LOST item available.</div>";

            return;
        }


        /*
         * Get ID from URL if available
         */

        const params =
            new URLSearchParams(
                window.location.search
            );

        const requestedId =
            params.get("id");


        let lostReport;


        if (requestedId) {

            lostReport =
                lostReports.find(
                    report =>
                        String(report.id) ===
                        String(requestedId)
                );

        }


        /*
         * If no ID was supplied,
         * use the latest LOST report.
         */

        if (!lostReport) {

            lostReport =
                lostReports[
                    lostReports.length - 1
                ];

        }


        /*
         * Display LOST item
         */

        lostItem.innerHTML = `

            <div class="field">
                <span class="label">
                    Category:
                </span>
                ${safe(lostReport.category)}
            </div>

            <div class="field">
                <span class="label">
                    Color:
                </span>
                ${safe(lostReport.color)}
            </div>

            <div class="field">
                <span class="label">
                    Brand:
                </span>
                ${safe(lostReport.brand)}
            </div>

            <div class="field">
                <span class="label">
                    Description:
                </span>
                ${safe(lostReport.description)}
            </div>

            <div class="field">
                <span class="label">
                    Location:
                </span>
                ${safe(lostReport.location)}
            </div>

            <div class="field">
                <span class="label">
                    Date & Time:
                </span>
                ${safe(lostReport.date_time)}
            </div>

        `;


        /*
         * Find FOUND reports
         */

        const foundReports =
            reports.filter(
                report =>
                    report.report_type === "FOUND"
            );


        if (foundReports.length === 0) {

            matches.innerHTML =
                "<div class='no-match'>No FOUND reports available.</div>";

            return;
        }


        /*
         * Calculate scores
         */

        const results =
            foundReports.map(
                found => {

                    const textScore =
                        calculateTextScore(
                            lostReport,
                            found
                        );


                    const attributeScore =
                        calculateAttributeScore(
                            lostReport,
                            found
                        );


                    const locationScore =
                        calculateLocationScore(
                            lostReport,
                            found
                        );


                    const timeScore =
                        calculateTimeScore(
                            lostReport,
                            found
                        );


                    /*
                     * Final score
                     */

                    const finalScore =
                        (
                            textScore * 0.35
                            +
                            attributeScore * 0.40
                            +
                            locationScore * 0.15
                            +
                            timeScore * 0.10
                        );


                    return {

                        report: found,

                        textScore:
                            textScore,

                        attributeScore:
                            attributeScore,

                        locationScore:
                            locationScore,

                        timeScore:
                            timeScore,

                        finalScore:
                            finalScore

                    };

                }
            );


        /*
         * Highest score first
         */

        results.sort(
            (a, b) =>
                b.finalScore -
                a.finalScore
        );


        /*
         * Display matches
         */

        matches.innerHTML = "";


        results.forEach(
            (item, index) => {

                const found =
                    item.report;


                const score =
                    (
                        item.finalScore * 100
                    ).toFixed(2);


                let photoHTML = "";


                if (found.photo_path) {

                    photoHTML = `

                        <img
                            class="photo"
                            src="/${found.photo_path}"
                            alt="Found item photo"
                        >

                    `;

                }


                matches.innerHTML += `

                    <div class="card match-card">

                        <div class="match-number">
                            🧳 Match #${index + 1}
                        </div>


                        <div class="score-box">

                            <div class="score-title">
                                AI Match Score
                            </div>

                            <div class="score">
                                🤖 ${score}%
                            </div>

                        </div>


                        <div class="field">
                            <span class="label">
                                Category:
                            </span>
                            ${safe(found.category)}
                        </div>


                        <div class="field">
                            <span class="label">
                                Color:
                            </span>
                            ${safe(found.color)}
                        </div>


                        <div class="field">
                            <span class="label">
                                Brand:
                            </span>
                            ${safe(found.brand)}
                        </div>


                        <div class="field">
                            <span class="label">
                                Description:
                            </span>
                            ${safe(found.description)}
                        </div>


                        <div class="field">
                            <span class="label">
                                Location:
                            </span>
                            ${safe(found.location)}
                        </div>


                        <div class="field">
                            <span class="label">
                                Date & Time:
                            </span>
                            ${safe(found.date_time)}
                        </div>


                        <div class="details">

                            <div class="detail-row">
                                <span>
                                    📝 Text Similarity
                                </span>

                                <strong>
                                    ${
                                        (
                                            item.textScore * 100
                                        ).toFixed(2)
                                    }%
                                </strong>
                            </div>


                            <div class="detail-row">
                                <span>
                                    🏷️ Attribute Similarity
                                </span>

                                <strong>
                                    ${
                                        (
                                            item.attributeScore * 100
                                        ).toFixed(2)
                                    }%
                                </strong>
                            </div>


                            <div class="detail-row">
                                <span>
                                    📍 Location Similarity
                                </span>

                                <strong>
                                    ${
                                        (
                                            item.locationScore * 100
                                        ).toFixed(2)
                                    }%
                                </strong>
                            </div>


                            <div class="detail-row">
                                <span>
                                    ⏰ Time Similarity
                                </span>

                                <strong>
                                    ${
                                        (
                                            item.timeScore * 100
                                        ).toFixed(2)
                                    }%
                                </strong>
                            </div>

                        </div>


                        ${photoHTML}

                    </div>

                `;

            }
        );

    }


    catch (error) {

        console.error(
            "LostLink error:",
            error
        );


        lostItem.innerHTML = "";


        matches.innerHTML = `

            <div class="error">

                ❌ Unable to load matches.

                <br><br>

                Make sure the LostLink server
                is running.

            </div>

        `;

    }

}


/* =====================================
   TEXT SIMILARITY
===================================== */

function calculateTextScore(
    lost,
    found
) {

    const lostText =
        getText(lost);

    const foundText =
        getText(found);


    if (
        !lostText ||
        !foundText
    ) {
        return 0;
    }


    const lostWords =
        new Set(
            lostText.split(/\s+/)
        );


    const foundWords =
        new Set(
            foundText.split(/\s+/)
        );


    let common = 0;


    lostWords.forEach(
        word => {

            if (
                foundWords.has(word)
            ) {

                common++;

            }

        }
    );


    const total =
        new Set([
            ...lostWords,
            ...foundWords
        ]).size;


    if (total === 0) {
        return 0;
    }


    return common / total;
}


/* =====================================
   ATTRIBUTE SIMILARITY
===================================== */

function calculateAttributeScore(
    lost,
    found
) {

    const fields = [
        "category",
        "color",
        "brand"
    ];


    let total = 0;

    let matched = 0;


    fields.forEach(
        field => {

            const lostValue =
                String(
                    lost[field] || ""
                )
                .trim()
                .toLowerCase();


            const foundValue =
                String(
                    found[field] || ""
                )
                .trim()
                .toLowerCase();


            if (lostValue) {

                total++;


                if (
                    lostValue ===
                    foundValue
                ) {

                    matched++;

                }

            }

        }
    );


    if (total === 0) {
        return 0;
    }


    return matched / total;
}


/* =====================================
   LOCATION SIMILARITY
===================================== */

function calculateLocationScore(
    lost,
    found
) {

    const lostLocation =
        String(
            lost.location || ""
        )
        .trim()
        .toLowerCase();


    const foundLocation =
        String(
            found.location || ""
        )
        .trim()
        .toLowerCase();


    if (
        !lostLocation ||
        !foundLocation
    ) {
        return 0;
    }


    if (
        lostLocation ===
        foundLocation
    ) {

        return 1;

    }


    return 0.2;
}


/* =====================================
   TIME SIMILARITY
===================================== */

function calculateTimeScore(
    lost,
    found
) {

    if (
        !lost.date_time ||
        !found.date_time
    ) {

        return 0;

    }


    const lostTime =
        new Date(
            lost.date_time
        );


    const foundTime =
        new Date(
            found.date_time
        );


    if (
        isNaN(lostTime.getTime()) ||
        isNaN(foundTime.getTime())
    ) {

        return 0;

    }


    const difference =
        Math.abs(
            foundTime - lostTime
        ) / 60000;


    if (difference <= 30) {
        return 1;
    }


    if (difference <= 120) {
        return 0.8;
    }


    if (difference <= 1440) {
        return 0.5;
    }


    return 0.2;
}


/* =====================================
   TEXT BUILDER
===================================== */

function getText(report) {

    return [

        report.category,

        report.color,

        report.brand,

        report.description

    ]
    .filter(
        value =>
            value !== null &&
            value !== undefined &&
            String(value).trim() !== ""
    )
    .join(" ")
    .toLowerCase();

}


/* =====================================
   SAFE DISPLAY
===================================== */

function safe(value) {

    if (
        value === null ||
        value === undefined ||
        String(value).trim() === ""
    ) {

        return "Not provided";

    }


    return String(value);

}


/* =====================================
   START
===================================== */

loadMatches();

</script>

</body>

</html>
