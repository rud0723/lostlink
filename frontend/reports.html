<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LostLink - Reports</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
        }

        /* HEADER */

        .header {
            background: #172554;
            color: white;
            padding: 25px 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 30px;
        }

        .header p {
            margin: 8px 0 0;
            color: #dbeafe;
        }

        /* MAIN CONTAINER */

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* TOP BAR */

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .top-bar h2 {
            margin: 0;
            color: #172554;
        }

        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 11px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .all-btn {
            background: #172554;
            color: white;
        }

        .lost-btn {
            background: #fee2e2;
            color: #991b1b;
        }

        .found-btn {
            background: #dcfce7;
            color: #166534;
        }

        /* REPORT GRID */

        #reportsContainer {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

        /* REPORT CARD */

        .report-card {
            background: white;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border: 1px solid #e5e7eb;
        }

        .report-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .report-id {
            font-size: 14px;
            color: #64748b;
            font-weight: bold;
        }

        /* STATUS */

        .status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .lost {
            background: #fee2e2;
            color: #b91c1c;
        }

        .found {
            background: #dcfce7;
            color: #15803d;
        }

        /* REPORT INFORMATION */

        .info {
            margin-bottom: 10px;
            display: flex;
            gap: 8px;
        }

        .label {
            width: 105px;
            font-weight: bold;
            color: #475569;
            flex-shrink: 0;
        }

        .value {
            color: #1e293b;
            word-break: break-word;
        }

        .description {
            margin-top: 15px;
            padding: 12px;
            background: #f8fafc;
            border-radius: 8px;
            line-height: 1.5;
        }

        .description strong {
            display: block;
            margin-bottom: 5px;
            color: #475569;
        }

        /* PHOTO */

        .report-photo {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 10px;
            margin-top: 15px;
        }

        /* EMPTY */

        .empty {
            text-align: center;
            background: white;
            padding: 50px 20px;
            border-radius: 14px;
            color: #64748b;
            grid-column: 1 / -1;
        }

        /* LOADING */

        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
            grid-column: 1 / -1;
        }

        /* RESPONSIVE */

        @media (max-width: 600px) {

            .header h1 {
                font-size: 24px;
            }

            .container {
                padding: 0 12px;
            }

            #reportsContainer {
                grid-template-columns: 1fr;
            }

            .info {
                display: block;
            }

            .label {
                display: block;
                margin-bottom: 3px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <div class="header">
        <h1>🔎 LostLink</h1>
        <p>Lost & Found Reports Dashboard</p>
    </div>


    <!-- MAIN -->

    <div class="container">

        <div class="top-bar">

            <h2>All Reports</h2>

            <div class="buttons">

                <button class="all-btn" onclick="showReports('ALL')">
                    All
                </button>

                <button class="lost-btn" onclick="showReports('LOST')">
                    🔴 Lost
                </button>

                <button class="found-btn" onclick="showReports('FOUND')">
                    🟢 Found
                </button>

            </div>

        </div>


        <!-- REPORTS -->

        <div id="reportsContainer">

            <div class="loading">
                Loading reports...
            </div>

        </div>

    </div>


    <script>

        let allReports = [];


        // =========================================
        // GET REPORTS FROM FASTAPI
        // =========================================

        async function loadReports() {

            const container =
                document.getElementById("reportsContainer");

            try {

                const response =
                    await fetch("/reports");

                if (!response.ok) {
                    throw new Error("Could not load reports");
                }

                allReports = await response.json();

                showReports("ALL");

            } catch (error) {

                container.innerHTML = `
                    <div class="empty">
                        <h3>⚠️ Unable to load reports</h3>
                        <p>Make sure the LostLink server is running.</p>
                    </div>
                `;

                console.error(error);
            }
        }


        // =========================================
        // SHOW REPORTS
        // =========================================

        function showReports(type) {

            const container =
                document.getElementById("reportsContainer");

            let reports = allReports;

            if (type !== "ALL") {

                reports = allReports.filter(
                    report => report.report_type === type
                );

            }


            if (reports.length === 0) {

                container.innerHTML = `
                    <div class="empty">
                        <h3>No reports found</h3>
                        <p>There are no ${type === "ALL" ? "" : type.toLowerCase()} reports yet.</p>
                    </div>
                `;

                return;
            }


            container.innerHTML = "";


            reports.forEach(report => {

                const card =
                    document.createElement("div");

                card.className = "report-card";


                const isLost =
                    report.report_type === "LOST";


                const statusClass =
                    isLost ? "lost" : "found";


                const statusText =
                    isLost ? "🔴 LOST" : "🟢 FOUND";


                // Format date and time

                let formattedDate = report.date_time || "Not provided";

                if (report.date_time) {

                    const date =
                        new Date(report.date_time);

                    if (!isNaN(date)) {

                        formattedDate =
                            date.toLocaleString(
                                "en-IN",
                                {
                                    day: "2-digit",
                                    month: "short",
                                    year: "numeric",
                                    hour: "2-digit",
                                    minute: "2-digit"
                                }
                            );
                    }
                }


                // Photo

                let photoHTML = "";

                if (report.photo_path) {

                    photoHTML = `
                        <img
                            class="report-photo"
                            src="/${report.photo_path}"
                            alt="Item Photo"
                        >
                    `;
                }


                card.innerHTML = `

                    <div class="report-header">

                        <span class="report-id">
                            Report #${report.id}
                        </span>

                        <span class="status ${statusClass}">
                            ${statusText}
                        </span>

                    </div>


                    <div class="info">

                        <span class="label">
                            Reported by:
                        </span>

                        <span class="value">
                            ${report.reporter_name || "Not provided"}
                        </span>

                    </div>


                    <div class="info">

                        <span class="label">
                            Role:
                        </span>

                        <span class="value">
                            ${report.reporter_role || "Not provided"}
                        </span>

                    </div>


                    <div class="info">

                        <span class="label">
                            Category:
                        </span>

                        <span class="value">
                            ${report.category || "Not provided"}
                        </span>

                    </div>


                    <div class="info">

                        <span class="label">
                            Color:
                        </span>

                        <span class="value">
                            ${report.color || "Not provided"}
                        </span>

                    </div>


                    <div class="info">

                        <span class="label">
                            Brand:
                        </span>

                        <span class="value">
                            ${report.brand || "Not provided"}
                        </span>

                    </div>


                    <div class="info">

                        <span class="label">
                            Location:
                        </span>

                        <span class="value">
                            ${report.location || "Not provided"}
                        </span>

                    </div>


                    <div class="info">

                        <span class="label">
                            Date & Time:
                        </span>

                        <span class="value">
                            ${formattedDate}
                        </span>

                    </div>


                    <div class="description">

                        <strong>Description</strong>

                        ${report.description || "No description provided"}

                    </div>


                    ${photoHTML}

                `;


                container.appendChild(card);

            });

        }


        // =========================================
        // LOAD WHEN PAGE OPENS
        // =========================================

        loadReports();

    </script>

</body>

</html>
